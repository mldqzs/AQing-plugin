<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>主人列表</title>
    <style>
        @font-face {
            font-family: "tttgbnumber";
            src: url("{{pluResPath}}/plugins/AQing-plugin/resources/font/tttgbnumber.ttf");
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'tttgbnumber', -apple-system, "PingFang SC", "Microsoft YaHei", "Droid Sans Fallback", sans-serif;
        }

        body {
            width: 720px;
            position: relative;
            padding: 30px;
            /* 与帮助图一致：初音背景图 + 轻柔光遮罩，整体 iOS 果冻质感 */
            background:
                linear-gradient(160deg, rgba(120, 170, 255, 0.30) 0%, rgba(180, 150, 240, 0.22) 50%, rgba(255, 180, 220, 0.28) 100%),
                url("{{pluResPath}}/plugins/AQing-plugin/resources/html/help/img/bg-miku.png");
            background-size: cover;
            background-position: center top;
        }

        /* 清透果冻玻璃外卡 */
        .container {
            position: relative;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 34px;
            padding: 28px 26px;
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            box-shadow:
                0 18px 50px rgba(70, 90, 160, 0.26),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px) saturate(135%);
            -webkit-backdrop-filter: blur(5px) saturate(135%);
        }

        .head_box {
            text-align: center;
            margin-bottom: 24px;
        }

        .head_box h1 {
            font-size: 44px;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 0 4px 14px rgba(70, 90, 170, 0.55);
        }

        .head_box .subtitle {
            display: inline-block;
            margin-top: 14px;
            font-size: 16px;
            color: #5b4b8a;
            letter-spacing: 1px;
            padding: 7px 20px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.72));
            box-shadow:
                0 6px 16px rgba(80, 100, 180, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 果冻卡片 */
        .card {
            position: relative;
            display: flex;
            align-items: center;
            border-radius: 22px;
            padding: 14px 20px;
            overflow: hidden;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.24));
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow:
                0 10px 22px rgba(60, 80, 160, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(3px) saturate(130%);
            -webkit-backdrop-filter: blur(3px) saturate(130%);
        }

        /* 顶部高光，营造果冻反光 */
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 46%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
            pointer-events: none;
        }

        .avatar-bubble {
            position: relative;
            width: 78px;
            height: 78px;
            flex-shrink: 0;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.95), rgba(235, 230, 255, 0.85));
            box-shadow:
                0 4px 12px rgba(90, 110, 190, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .avatar-bubble img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #eee;
        }

        .info {
            position: relative;
            margin-left: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .nickname {
            font-size: 26px;
            color: #34286b;
            font-weight: bold;
            margin-bottom: 6px;
            word-break: break-all;
        }

        .qq {
            font-size: 18px;
            color: #6a52b0;
        }

        .index {
            position: relative;
            margin-left: auto;
            font-size: 30px;
            color: rgba(90, 75, 138, 0.42);
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 1px 4px rgba(70, 90, 170, 0.4);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="head_box">
            <h1>主人列表</h1>
            <div class="subtitle">当前共有 {{total}} 位主人</div>
        </div>
        <div class="grid">
            {{each masters m i}}
            <div class="card">
                <div class="avatar-bubble"><img src="{{m.avatar}}" /></div>
                <div class="info">
                    <div class="nickname">{{m.nickname}}</div>
                    <div class="qq">QQ：{{m.qq}}</div>
                </div>
                <div class="index">#{{i + 1}}</div>
            </div>
            {{/each}}
        </div>
        <div class="footer">AQing-plugin · 主人管理</div>
    </div>
</body>

</html>
