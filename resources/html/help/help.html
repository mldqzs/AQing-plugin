<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>阿晴插件帮助</title>
    <style>
        @font-face {
            font-family: "tttgbnumber";
            src: url("{{pluResPath}}/plugins/AQing-plugin/resources/font/tttgbnumber.ttf");
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'tttgbnumber', -apple-system, "PingFang SC", "Microsoft YaHei", "Droid Sans Fallback", sans-serif;
        }

        body {
            width: 840px;
            position: relative;
            padding: 30px;
            /* root 里的初音背景图 + 轻柔光遮罩，整体偏 iOS 果冻质感 */
            background:
                linear-gradient(160deg, rgba(120, 170, 255, 0.30) 0%, rgba(180, 150, 240, 0.22) 50%, rgba(255, 180, 220, 0.28) 100%),
                url("{{pluResPath}}/plugins/AQing-plugin/resources/html/help/img/bg-miku.png");
            background-size: cover;
            background-position: center top;
        }

        /* 整张卡片：清透果冻玻璃（弱化模糊，让背景透出来） */
        .container {
            position: relative;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 34px;
            padding: 28px 26px;
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            box-shadow:
                0 18px 50px rgba(70, 90, 160, 0.26),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px) saturate(135%);
            -webkit-backdrop-filter: blur(5px) saturate(135%);
        }

        .head_box {
            text-align: center;
            margin-bottom: 22px;
        }

        .head_box h1 {
            font-size: 46px;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 0 4px 14px rgba(70, 90, 170, 0.55);
        }

        .head_box .subtitle {
            display: inline-block;
            margin-top: 14px;
            font-size: 16px;
            color: #5b4b8a;
            letter-spacing: 1px;
            padding: 7px 20px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.72));
            box-shadow:
                0 6px 16px rgba(80, 100, 180, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .help-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        /* 果冻卡片 */
        .card {
            position: relative;
            display: flex;
            align-items: center;
            border-radius: 22px;
            padding: 13px 16px;
            overflow: hidden;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.24));
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow:
                0 10px 22px rgba(60, 80, 160, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(3px) saturate(130%);
            -webkit-backdrop-filter: blur(3px) saturate(130%);
        }

        /* 顶部高光，营造果冻反光 */
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 46%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
            pointer-events: none;
        }

        .card .icon-bubble {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.95), rgba(235, 230, 255, 0.85));
            box-shadow:
                0 4px 12px rgba(90, 110, 190, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .card .icon-bubble img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .card .text {
            position: relative;
            margin-left: 14px;
            min-width: 0;
        }

        .card .title {
            font-size: 18px;
            color: #34286b;
            font-weight: bold;
            margin-bottom: 4px;
            word-break: break-all;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .card .desc {
            font-size: 13px;
            color: #6a6190;
            line-height: 1.4;
            word-break: break-all;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
        }

        .footer .version {
            display: inline-block;
            background: linear-gradient(180deg, rgba(60, 50, 110, 0.55), rgba(40, 35, 80, 0.45));
            color: #ffffff;
            font-size: 15px;
            padding: 9px 24px;
            border-radius: 999px;
            letter-spacing: 1px;
            box-shadow:
                0 6px 16px rgba(40, 40, 90, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        .footer .version b {
            color: #ffe27a;
        }

        .footer .credit {
            margin-top: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 1px 4px rgba(60, 70, 140, 0.5);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="head_box">
            <h1>阿晴插件</h1>
            <div class="subtitle">AQing-plugin · 功能帮助 · 共 {{helpList.list.length}} 项</div>
        </div>

        <div class="help-grid">
            {{each helpList.list list}}
            <div class="card">
                <div class="icon-bubble">
                    <img src="{{pluResPath}}/plugins/AQing-plugin/resources/html/help/img/{{list.icon}}.png"
                         onerror="this.onerror=null;this.src='{{pluResPath}}/plugins/AQing-plugin/resources/html/help/img/16.png'">
                </div>
                <div class="text">
                    <div class="title">{{list.title}}</div>
                    <div class="desc">{{list.desc}}</div>
                </div>
            </div>
            {{/each}}
        </div>

        <div class="footer">
            <div class="version">
                TRSS-Yunzai <b>v{{yunzaiVersion}}</b> &nbsp;·&nbsp; AQing-plugin <b>v{{pluginVersion}}</b>
            </div>
            <div class="credit">Created By 明るい青紫色 · 发送「#阿晴版本」查看版本信息</div>
        </div>
    </div>
</body>

</html>
