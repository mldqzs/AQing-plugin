<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>阿晴插件帮助</title>
    <style>
        @font-face {
            font-family: "tttgbnumber";
            src: url("{{pluResPath}}/plugins/AQing-plugin/resources/font/tttgbnumber.ttf");
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'tttgbnumber', Arial, "Microsoft YaHei", "WenQuanYi Micro Hei", "Droid Sans Fallback", sans-serif;
        }

        body {
            width: 880px;
            background: linear-gradient(135deg, #6a5af9 0%, #8e6ad6 45%, #c86dd7 100%);
            padding: 36px;
        }

        .container {
            background: rgba(255, 255, 255, 0.10);
            border-radius: 28px;
            padding: 34px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .head_box {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 22px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.25);
        }

        .head_box h1 {
            font-size: 44px;
            color: #ffffff;
            letter-spacing: 3px;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }

        .head_box .subtitle {
            margin-top: 10px;
            font-size: 19px;
            color: rgba(255, 255, 255, 0.82);
            letter-spacing: 1px;
        }

        .help-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 16px;
            padding: 14px 18px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
            border-left: 5px solid #8e6ad6;
        }

        .card .icon {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            object-fit: cover;
            flex-shrink: 0;
            background: #efeaff;
            padding: 4px;
        }

        .card .text {
            margin-left: 16px;
            min-width: 0;
        }

        .card .title {
            font-size: 20px;
            color: #2d2150;
            font-weight: bold;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .card .desc {
            font-size: 14px;
            color: #7a7193;
            line-height: 1.45;
            word-break: break-all;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid rgba(255, 255, 255, 0.25);
            text-align: center;
        }

        .footer .version {
            display: inline-block;
            background: rgba(0, 0, 0, 0.28);
            color: #ffffff;
            font-size: 16px;
            padding: 8px 22px;
            border-radius: 20px;
            letter-spacing: 1px;
        }

        .footer .version b {
            color: #ffe27a;
        }

        .footer .credit {
            margin-top: 12px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.65);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="head_box">
            <h1>阿晴插件</h1>
            <div class="subtitle">AQing-plugin · 功能帮助 · 共 {{helpList.list.length}} 项</div>
        </div>

        <div class="help-grid">
            {{each helpList.list list}}
            <div class="card">
                <img class="icon" src="{{pluResPath}}/plugins/AQing-plugin/resources/html/help/img/{{list.icon}}.png">
                <div class="text">
                    <div class="title">{{list.title}}</div>
                    <div class="desc">{{list.desc}}</div>
                </div>
            </div>
            {{/each}}
        </div>

        <div class="footer">
            <div class="version">
                TRSS-Yunzai <b>v{{yunzaiVersion}}</b> &nbsp;·&nbsp; AQing-plugin <b>v{{pluginVersion}}</b>
            </div>
            <div class="credit">Created By 明るい青紫色 · 发送「#阿晴版本」查看版本信息（图片）</div>
        </div>
    </div>
</body>

</html>
