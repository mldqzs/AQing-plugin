<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>阿晴插件 版本信息</title>
    <style>
        @font-face {
            font-family: "tttgbnumber";
            src: url("{{pluResPath}}/plugins/AQing-plugin/resources/font/tttgbnumber.ttf");
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'tttgbnumber', -apple-system, "PingFang SC", "Microsoft YaHei", "Droid Sans Fallback", sans-serif;
        }

        body {
            width: 600px;
            position: relative;
            padding: 30px;
            /* 与帮助图一致：初音背景 + 轻柔光遮罩，iOS 清透果冻质感 */
            background:
                linear-gradient(160deg, rgba(120, 170, 255, 0.30) 0%, rgba(180, 150, 240, 0.22) 50%, rgba(255, 180, 220, 0.28) 100%),
                url("{{pluResPath}}/plugins/AQing-plugin/resources/html/help/img/bg-miku.png");
            background-size: cover;
            background-position: center top;
        }

        /* 整张卡片：清透果冻玻璃 */
        .container {
            position: relative;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 34px;
            padding: 28px 26px;
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            box-shadow:
                0 18px 50px rgba(70, 90, 160, 0.26),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px) saturate(135%);
            -webkit-backdrop-filter: blur(5px) saturate(135%);
        }

        .head_box {
            text-align: center;
            margin-bottom: 22px;
        }

        .head_box h1 {
            font-size: 42px;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 0 4px 14px rgba(70, 90, 170, 0.55);
        }

        .head_box .subtitle {
            display: inline-block;
            margin-top: 14px;
            font-size: 16px;
            color: #5b4b8a;
            letter-spacing: 1px;
            padding: 7px 20px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.72));
            box-shadow:
                0 6px 16px rgba(80, 100, 180, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        /* 版本行：果冻药丸 */
        .ver-row {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.26));
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 16px 22px;
            margin-bottom: 14px;
            box-shadow:
                0 10px 22px rgba(60, 80, 160, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(3px) saturate(130%);
            -webkit-backdrop-filter: blur(3px) saturate(130%);
        }

        .ver-row::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 46%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
            pointer-events: none;
        }

        .ver-row .name {
            position: relative;
            font-size: 20px;
            color: #34286b;
            font-weight: bold;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .ver-row .ver {
            position: relative;
            font-size: 20px;
            color: #7a59c2;
            font-weight: bold;
        }

        .changelog {
            margin-top: 18px;
        }

        .changelog .clog-title {
            font-size: 17px;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(70, 90, 170, 0.55);
        }

        .changelog .clog-title b {
            color: #ffe27a;
        }

        .changelog .clog-body {
            position: relative;
            overflow: hidden;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.26));
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 18px 22px;
            box-shadow:
                0 10px 22px rgba(60, 80, 160, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(3px) saturate(130%);
            -webkit-backdrop-filter: blur(3px) saturate(130%);
        }

        .changelog .clog-body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 38%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0));
            pointer-events: none;
        }

        .changelog .clog-line {
            position: relative;
            font-size: 15px;
            color: #4a4163;
            line-height: 1.7;
            word-break: break-all;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
        }

        .footer .version {
            display: inline-block;
            background: linear-gradient(180deg, rgba(60, 50, 110, 0.55), rgba(40, 35, 80, 0.45));
            color: #ffffff;
            font-size: 14px;
            padding: 9px 24px;
            border-radius: 999px;
            letter-spacing: 1px;
            box-shadow:
                0 6px 16px rgba(40, 40, 90, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        .footer .version b {
            color: #ffe27a;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="head_box">
            <h1>阿晴插件</h1>
            <div class="subtitle">AQing-plugin · 版本信息</div>
        </div>

        <div class="ver-row">
            <span class="name">TRSS-Yunzai</span>
            <span class="ver">v{{yunzaiVersion}}</span>
        </div>
        <div class="ver-row">
            <span class="name">AQing-plugin</span>
            <span class="ver">v{{pluginVersion}}</span>
        </div>

        {{if changeVer}}
        <div class="changelog">
            <div class="clog-title">最新更新 · <b>{{changeVer}}</b></div>
            <div class="clog-body">
                {{each changeBody line}}
                <div class="clog-line">{{line}}</div>
                {{/each}}
            </div>
        </div>
        {{/if}}

        <div class="footer">
            <div class="version">
                TRSS-Yunzai <b>v{{yunzaiVersion}}</b> &nbsp;·&nbsp; AQing-plugin <b>v{{pluginVersion}}</b>
            </div>
        </div>
    </div>
</body>

</html>
