<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机弱智吧</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --text-light: #ecf0f1;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(rgba(249, 249, 249, 0), rgba(248, 247, 247, 0)), url('{http://acg.yaohud.cn/dm/acg.php}');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        .card {
            width: 90%;
            max-width: 680px;
            background: rgba(255, 255, 255, 0.37);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.34);
            backdrop-filter: blur(4px);
            margin: 20px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .title {
            color: var(--primary-color);
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.671);
        }

        .content {
            color: var(--primary-color);
            line-height: 1.6;
        }

        .question {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            padding: 1rem;
            background: rgb(252, 2, 44);
            border-left: 4px solid var(--accent-color);
            border-radius: 4px;
        }

        .answer {
            font-size: 1.2rem;
            margin: 1.5rem 0;
            padding: 1rem;
            background: rgba(52, 152, 219, 0.616);
            border-left: 4px solid #0098fe;
            border-radius: 4px;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            color: #000101;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1 class="title">弱智吧精选</h1>
        </div>
        <div class="content">
            <div class="question">{{question}}</div>
            <div class="answer">{{answer}}</div>
        </div>
        <div class="footer">
            Generated by AQing-plugin • {{timestamp}}
        </div>
    </div>
</body>
</html>
