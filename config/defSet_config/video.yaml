# ============ 短视频解析配置 ============
# 在群里/私聊发抖音、快手、B站的分享链接，机器人自动解析为
# 「标题 + 封面 + 视频」（图文笔记则发图片）。无需指令，发链接即触发。
#
# 修改方式（任选其一，均热生效、无需重启）：
#   1.【推荐】锅巴：管理面板 → AQing-plugin → 短视频解析
#   2.【手动】直接编辑本文件（config/config/video.yaml）后保存即可
#
# 解析后端：全部为「原生轻量解析」，不依赖 yt-dlp、无需 cookie、低配服务器也扛得住。
#   · B站   官方 API
#   · 抖音   iesdouyin 移动分享页（自动去水印）
#   · 快手   移动分享页 INIT_STATE

enable: true              # 总开关
parseBili: true           # B站解析开关
parseDouyin: true         # 抖音解析开关
parseKuaishou: true       # 快手解析开关

sendVideo: true           # 是否发送视频本体；关闭则只发「标题 + 封面 + 直链」
maxDuration: 600          # 视频时长上限（秒），超过则不下载、改发信息与直链
maxSize: 100              # 视频体积上限（MB），超过则不下载、改发信息与直链

sendBgm: false            # 是否额外提取背景音乐（ffmpeg 抽音轨），发语音条 + mp3 文件；默认关
                          # 注：抽的是视频音轨，纯音乐视频即 BGM，有人声的会是「人声+BGM」混音

isCD: true                # 是否开启解析 CD（同一群/私聊冷却，防刷屏）
CD: 10                    # CD 时长（秒）
