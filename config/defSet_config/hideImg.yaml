enable: true          #小番茄图片混淆总开关,默认开启
maxMB: 12             #输入图片最大体积(MB),太大占内存
outputFormat: png     #输出格式: png=全部 PNG(最适合 QQ 传输), auto=混图 JPG/解图 PNG, jpg=全部 JPG
qqSafeScale: 2        #混图抗压缩倍数: 把像素放大成色块, 下载/转发到 QQ 后再解图更稳
maxSide: 1600         #混图前最大边限制, 避免图片过大; 0=不限制
# 结果一律通过 QQ 合并转发发送图片本体, 不再生成/返回任何图片链接(外部图床、本地图链公网地址已移除)
