enable: true            #小番茄图片混淆总开关,默认开启
sendMode: forward       #结果发送方式: forward=QQ合并转发图片本体(默认), link=临时网址
linkProvider: auto      #临时网址来源: auto=外部图床失败再本地图链, catbox, litterbox, local=仅本地图链
maxMB: 12               #输入图片最大体积(MB),太大占内存
outputFormat: png       #输出格式: png=全部 PNG(最适合 QQ 传输), auto=混图 JPG/解图 PNG, jpg=全部 JPG
qqSafeScale: 2          #混图抗压缩倍数: 把像素放大成色块, 下载/转发到 QQ 后再解图更稳
maxSide: 1600           #混图前最大边限制, 避免图片过大; 0=不限制
linkExpireMin: 10       #本地临时链接有效期(分钟),linkProvider=local 或 auto 兜底时使用
linkMaxViews: 0         #本地临时链接最大访问次数,0=不限制次数直到过期
linkPublicBaseUrl: ''   #本地临时链接公网地址,如 http://1.2.3.4:2536 ;留空则用云崽 Bot.fileToUrl 返回值(很多环境默认 localhost)
# 指令后缀可临时覆盖发送方式: 「小番茄解图 链接」「小番茄混图 转发」
