# ============ 涩图打分 · 百度图片内容审核 key 配置 ============
# 在百度智能云开通「内容审核-图像」并创建应用后，可获得下面三个 key。
# 注意：若你同时在用「色图监听」，请勿直接复用它的 key，
#       请另建一个百度应用，因为两者需要不同的审核策略。
#
# 修改方式（任选其一）：
#   1.【推荐】锅巴：进入锅巴管理面板 → AQing-plugin → 涩图打分，填入三个 key
#   2.【手动】直接编辑本文件（config/config/spdf.yaml）后保存即可，热生效无需重启
# 群内发送「#涩图打分帮助」可随时查看以上说明。

APP_ID: '你的 App ID'
API_KEY: '你的 Api Key'
SECRET_KEY: '你的 Secret Key'

# ============ CD 设置 ============
isCD: true   # true=有CD，false=无CD；主人始终不受 CD 限制
CD: 60       # CD 时长（单位：分钟，最小为 1）

# ============ 0~100 分评价（每 10 分一档，可自行修改） ============
dic:
  - 就这就这？不要小瞧色图啊混蛋！                    # 0~10 分
  - 就这就这？不要小瞧色图啊混蛋！                    # 10~20 分
  - 就这就这？不要小瞧色图啊混蛋！                    # 20~30 分
  - 啧，一般                                          # 30~40 分
  - 啧，一般                                          # 40~50 分
  - 啧，一般                                          # 50~60 分
  - 我超太涩了(//// ^ ////)快撤回别让狗管理看见！      # 60~70 分
  - 我超太涩了(//// ^ ////)快撤回别让狗管理看见！      # 70~80 分
  - 我超太涩了(//// ^ ////)快撤回别让狗管理看见！      # 80~90 分
  - 我超太涩了(//// ^ ////)快撤回别让狗管理看见！      # 90~100 分
