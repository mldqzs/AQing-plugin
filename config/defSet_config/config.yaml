botname: 阿晴 #机器人名字
muteTime: 5
jyGroupList: []
dailyReportGroupList: []
ai: false #ai开关,默认false关闭，改成true开启
fudu: false #复读开关,默认false关闭,改成true开启(消息由重复内容组成时叠加复读,如11→111、1212→121212)
repeatBanGroups: [] #开启复读禁言的群聊；群内命令与锅巴共同维护此列表
repeatBanThreshold: 3 #连续复读多少条后触发警告，可在锅巴修改
repeatBanTime: 1 #复读禁言初始禁言时间(分钟)
repeatBanStep: 1 #复读禁言每次阶梯叠加时长(分钟),默认1
kawaiiStatus: false #可爱状态开关,默认false关闭;开启后「#状态」由阿晴出可爱状态图,并接管(替换)云崽本体的状态统计。主人可发「#开启可爱状态/#关闭可爱状态」热切换
groupJoinCheck: false #入群审核开关,默认false关闭;开启后仅对下方群号列表生效。主人可在群内发「#开启入群审核/#关闭入群审核」热切换当前群
groupJoinCheckGroups: [] #入群审核生效群号列表,空列表表示未开启任何群
dailyReportTime: 08:00 #每日日报定时发送时间（HH:mm）
dailyReportHolidayUrl: https://fastly.jsdelivr.net/gh/NateScarlet/holiday-cn@master/{year}.json #中国节假日数据主源，{year}会替换为年份
dailyReportHolidayFallbackUrls:
  - https://cdn.jsdelivr.net/gh/NateScarlet/holiday-cn@master/{year}.json
  - https://raw.githubusercontent.com/NateScarlet/holiday-cn/master/{year}.json
dailyReportHolidayCacheTtl: 604800 #节假日数据缓存时间（秒）
dailyReportHolidayTimeout: 8000 #节假日数据请求超时（毫秒）

绝对主人:
  - 123456

start_tip: 阿晴上班了,今天又是充满干劲的一天~   #上班提示语
close_tip: 阿晴去玩了，开溜~      #下班提示语